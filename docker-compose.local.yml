# Local testing / development. Usage: docker compose -f docker-compose.local.yml up
# Or use the default: docker compose up (see docker-compose.yml)

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: printing
      POSTGRES_PASSWORD: printing
      POSTGRES_DB: printing
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://printing:printing@db:5432/printing
      NODE_ENV: development
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
    depends_on:
      - backend
    ports:
      - "3002:3000"

volumes:
  db-data:
  redis-data:
